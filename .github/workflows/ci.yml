name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  WRANGLER_SEND_METRICS: "false"
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Protocol/auth/queue regression tests, migration and deployment-config tests.
      - run: npm run check:release
      - run: npm test
      # Bundles and validates bindings exactly as `wrangler deploy` would, without deploying.
      - run: npm run check:build
      # Real workerd + local D1 built from migrations/ on a clean checkout.
      - run: npm run smoke
